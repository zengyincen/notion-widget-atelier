<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>宠物状态已更新</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      :root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#20201e;background:#f3f2ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(92vw,360px);padding:35px;border-radius:28px;background:#fff;text-align:center;box-shadow:0 24px 70px rgba(30,30,25,.12)}.face{font-family:monospace;font-size:34px;animation:bob 1s ease-in-out infinite alternate}.spark{color:#ff7b58;font-size:25px}h1{font-size:20px;margin:20px 0 8px}p{font-size:12px;color:#777;line-height:1.7}.bar{height:5px;border-radius:5px;background:#eee;overflow:hidden;margin-top:22px}.bar i{display:block;width:100%;height:100%;background:#ff7b58;animation:shrink 1.4s linear forwards;transform-origin:left}button{margin-top:18px;border:0;border-radius:11px;padding:10px 15px;background:#20201e;color:white;font-weight:700;font-size:11px}@keyframes bob{to{transform:translateY(-5px)}}@keyframes shrink{to{transform:scaleX(0)}}
    </style>
  </head>
  <body>
    <main class="card"><div class="spark">✦</div><div class="face">/ᐠ˵- ᴗ -˵ᐟ\</div><h1 id="message">状态已更新</h1><p>嵌入在 Notion 中的宠物会立即感知变化。<br />这个页面会自动关闭。</p><div class="bar"><i></i></div><button id="closeButton" type="button">立即关闭</button></main>
    <script>
      (()=>{const q=new URLSearchParams(location.search),pet=(q.get("pet")||"mochi").replace(/[^a-z0-9_-]/gi,"-"),action=q.get("do")||"pet",key=`notion-widget-box:pet:${pet}`,defaults={food:28,water:24,love:45,updated:Date.now(),lastFeed:0,lastWater:0};let value;try{value=JSON.parse(localStorage.getItem(key))||defaults}catch{value=defaults}const now=Date.now(),hours=Math.max(0,(now-(value.updated||now))/36e5),limit=2*36e5;value={...defaults,...value,food:Math.max(0,(value.food??28)-hours*3.2),water:Math.max(0,(value.water??24)-hours*4.2),love:Math.max(0,(value.love??45)-hours*1.7),updated:now};let accepted=true;if(action==="feed"){if(now-(value.lastFeed||0)<limit)accepted=false;else{value.food=Math.min(100,value.food+34);value.lastFeed=now}}if(action==="water"){if(now-(value.lastWater||0)<limit)accepted=false;else{value.water=Math.min(100,value.water+40);value.lastWater=now}}if(action==="pet")value.love=Math.min(100,value.love+12);localStorage.setItem(key,JSON.stringify(value));const labels={feed:accepted?"已投喂，正在恢复！":"2 小时内已经喂过啦",water:accepted?"已喂水，正在恢复！":"2 小时内已经喂过水啦",pet:"感到很安心！"};document.getElementById("message").textContent=labels[action]||"状态已更新";const close=()=>{window.close();setTimeout(()=>{if(history.length>1)history.back();},100)};document.getElementById("closeButton").onclick=close;setTimeout(close,1400)})();
    </script>
  </body>
</html>
